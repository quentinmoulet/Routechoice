# Déploiement Netlify (statique + fonctions serverless).
# Les fonctions définissent elles-mêmes leur route (export const config = { path }),
# donc pas de redirections à déclarer ici.
[build]
  publish = "."
  functions = "netlify/functions"
  # Genere un _redirects different selon la variable APP (voir netlify-build.mjs) :
  # site principal -> racine = index.html ; 2e site (APP=splits) -> racine = splits.html.
  command = "node netlify-build.mjs"

[build.environment]
  NODE_VERSION = "20"

# Ne pas publier les fichiers de dev / données de test
[build.processing]
  skip_processing = true
